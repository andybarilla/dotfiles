# Tasks for configuring container registries

- name: Check if unqualified-search-registries config exists
  ansible.builtin.stat:
    path: /etc/containers/registries.conf.d/10-unqualified-search-registries.conf
  register: registries_conf
  become: true

- name: Check if config already has docker.io
  ansible.builtin.command:
    cmd: grep -q 'docker.io' /etc/containers/registries.conf.d/10-unqualified-search-registries.conf
  register: docker_io_check
  changed_when: false
  failed_when: false
  when: registries_conf.stat.exists
  become: true

- name: Create unqualified-search-registries config
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/10-unqualified-search-registries.conf
    content: |
      unqualified-search-registries = ["docker.io"]
    owner: root
    group: root
    mode: '0644'
  become: true
  when: not registries_conf.stat.exists or docker_io_check.rc != 0
