---
- name: Add pam_gnome_keyring.so to greetd auth section
  community.general.pamd:
    name: greetd
    type: auth
    control: include
    module_path: system-local-login
    new_type: auth
    new_control: optional
    new_module_path: pam_gnome_keyring.so
    state: after
  become: true

- name: Add pam_gnome_keyring.so to greetd session section
  community.general.pamd:
    name: greetd
    type: session
    control: include
    module_path: system-local-login
    new_type: session
    new_control: optional
    new_module_path: pam_gnome_keyring.so
    module_arguments: 'auto_start'
    state: after
  become: true
