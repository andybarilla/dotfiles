# Install Starship prompt via cargo binstall
# https://starship.rs/

- name: Check if starship is installed
  ansible.builtin.command: starship --version
  register: starship_check
  changed_when: false
  failed_when: false

- name: Install starship via cargo binstall
  ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/cargo binstall starship --no-confirm"
  when: starship_check.rc != 0
  become: false
