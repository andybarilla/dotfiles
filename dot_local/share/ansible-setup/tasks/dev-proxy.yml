# Setup dnsmasq + Caddy for local development with .test domains
#
# - NetworkManager spawns dnsmasq and resolves *.test -> 127.0.0.1
# - Caddy reverse-proxies named hosts to local ports
#
# After setup, add a file per project to /etc/caddy/conf.d/, e.g.:
#
#   /etc/caddy/conf.d/myapp.conf:
#     myapp.test {
#         reverse_proxy localhost:8000
#     }
#
# Then reload: sudo systemctl reload caddy
#
# For HTTPS to be trusted in browsers, run once manually:
#   sudo caddy trust --address "unix//run/caddy/admin.socket"
# (Arch ships Caddy with the admin API on a Unix socket, not TCP)

- name: Configure NetworkManager to use dnsmasq for DNS
  community.general.ini_file:
    path: /etc/NetworkManager/NetworkManager.conf
    section: main
    option: dns
    value: dnsmasq
    mode: '0644'
  become: true
  register: nm_dns_config

- name: Create NetworkManager dnsmasq config directory
  ansible.builtin.file:
    path: /etc/NetworkManager/dnsmasq.d
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Configure .test TLD to resolve to localhost
  ansible.builtin.copy:
    dest: /etc/NetworkManager/dnsmasq.d/dev.conf
    content: |
      address=/.test/127.0.0.1
    mode: '0644'
    owner: root
    group: root
  become: true
  register: dnsmasq_dev_config

- name: Restart NetworkManager to apply dnsmasq configuration
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  become: true
  when: nm_dns_config.changed or dnsmasq_dev_config.changed

- name: Create initial Caddyfile if not present
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    content: |
      # Local development reverse proxy
      # Add a block per project, then run: sudo systemctl reload caddy
      #
      # Example:
      # myapp.test {
      #     reverse_proxy localhost:8000
      # }
    force: false
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Enable and start Caddy service
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
  become: true
