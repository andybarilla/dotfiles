# Git global configuration

- name: Set git user name
  community.general.git_config:
    name: user.name
    value: "Andy Barilla"
    scope: global

- name: Set git user email
  community.general.git_config:
    name: user.email
    value: "me@andybarilla.com"
    scope: global

- name: Set git default branch 
  community.general.git_config:
    name: init.defaultBranch
    value: "main"
    scope: global

- name: set git user name
  community.general.git_config:
    name: push.autosetupremote 
    value: true
    scope: global

- name: set git user name
  community.general.git_config:
    name: pull.rebase 
    value: false
    scope: global
