# Git global configuration

- name: Set git user name
  community.general.git_config:
    name: user.name
    value: "Andy Barilla"
    scope: global

- name: Set git user email
  community.general.git_config:
    name: user.email
    value: "me@andybarilla.com"
    scope: global

- name: Switch chezmoi remote to SSH
  ansible.builtin.command:
    cmd: git -C "{{ ansible_env.HOME }}/.local/share/chezmoi" remote set-url origin git@github.com:andybarilla/dotfiles.git
  changed_when: true
