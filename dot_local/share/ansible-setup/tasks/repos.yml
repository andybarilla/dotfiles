# Tasks for setting up external repositories
#
# On atomic systems (rpm-ostree), GPG keys are imported automatically from the
# gpgkey= line in repo files, so we only need to copy the repo files.
# On traditional systems, we need to explicitly import GPG keys first.

# Traditional Fedora only: import GPG keys
- name: Import GPG keys for external repos
  ansible.builtin.rpm_key:
    key: "{{ item.url }}"
    state: present
  loop: "{{ repo_gpg_keys }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
 
# Enable COPR repositories
- name: Enable Synology Drive COPR repo
  ansible.builtin.command:
    cmd: dnf copr enable -y emixampp/synology-drive
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:emixampp:synology-drive.repo
  become: true

- name: Enable WezTerm COPR repo
  ansible.builtin.command:
    cmd: dnf copr enable -y wezfurlong/wezterm-nightly
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:wezfurlong:wezterm-nightly.repo
  become: true

# Copy repository files
- name: Copy repository files
  ansible.builtin.copy:
    src: "files/repos/{{ item }}"
    dest: "/etc/yum.repos.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 1password.repo
    - vscode.repo
    - lens.repo
    - google-chrome.repo
  become: true
