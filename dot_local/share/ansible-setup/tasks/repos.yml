# Tasks for setting up external repositories
#
# On atomic systems (rpm-ostree), GPG keys are imported automatically from the
# gpgkey= line in repo files, so we only need to copy the repo files.
# On traditional systems, we need to explicitly import GPG keys first.

# Traditional Fedora only: import GPG keys
- name: Import GPG keys for external repos
  ansible.builtin.rpm_key:
    key: "{{ item.url }}"
    state: present
  loop: "{{ repo_gpg_keys }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: not is_atomic and not in_toolbox

# Copy repository files (works on both atomic and traditional)
- name: Copy repository files
  ansible.builtin.copy:
    src: "files/repos/{{ item }}"
    dest: "/etc/yum.repos.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 1password.repo
    - dropbox.repo
    - vscode.repo
    - lens.repo
  become: true
  when: not in_toolbox

# When running from toolbox, use flatpak-spawn to copy files to host
- name: Copy repository files to host
  ansible.builtin.command:
    cmd: flatpak-spawn --host sudo cp "{{ playbook_dir }}/files/repos/{{ item }}" "/etc/yum.repos.d/{{ item }}"
  loop:
    - 1password.repo
    - dropbox.repo
    - vscode.repo
    - lens.repo
  when: in_toolbox
  changed_when: true
