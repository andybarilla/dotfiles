# Tasks for configuring dnf settings on the host system

- name: Check if dnf.conf already has performance settings
  ansible.builtin.command:
    cmd: "grep -q 'max_parallel_downloads' /etc/dnf/dnf.conf"
  register: dnf_conf_check
  changed_when: false
  failed_when: false

- name: Add performance settings to dnf.conf
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    block: |
      fastest_mirror=True
      max_parallel_downloads=10
    marker: "# {mark} ANSIBLE MANAGED - performance settings"
    create: false
  become: true
  when: dnf_conf_check.rc != 0
