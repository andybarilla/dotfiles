# Package installation for Arch Linux (using aur)

- name: Check if paru is installed
  ansible.builtin.command:
    cmd: which paru
  register: paru_check
  changed_when: false
  failed_when: false

- name: Install paru if not present
  when: paru_check.rc != 0
  block:
    - name: Clone paru repository
      ansible.builtin.git:
        repo: https://aur.archlinux.org/paru.git
        dest: /tmp/paru-build
        depth: 1

    - name: Build and install paru
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm
        chdir: /tmp/paru-build
      become: false

    - name: Clean up paru build directory
      ansible.builtin.file:
        path: /tmp/paru-build
        state: absent

- name: Install AUR packages with paru
  ansible.builtin.command:
    cmd: "paru -S --noconfirm --needed {{ item }}"
  loop: "{{ arch_aur_packages }}"
  become: false
  register: paru_result
  changed_when: "'installing' in paru_result.stdout or 'upgrading' in paru_result.stdout"
  when: arch_aur_packages | length > 0
