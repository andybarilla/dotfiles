# Package installation for Arch Linux (using pacman)

- name: Update pacman cache
  community.general.pacman:
    update_cache: true
  become: true

- name: Install packages from Arch repos
  community.general.pacman:
    name: "{{ arch_packages }}"
    state: present
  become: true

- name: Check if yay is installed
  ansible.builtin.command:
    cmd: which yay
  register: yay_check
  changed_when: false
  failed_when: false

- name: Install yay if not present
  when: yay_check.rc != 0
  block:
    - name: Clone yay repository
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: /tmp/yay-build
        depth: 1

    - name: Build and install yay
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm
        chdir: /tmp/yay-build
      become: false

    - name: Clean up yay build directory
      ansible.builtin.file:
        path: /tmp/yay-build
        state: absent

- name: Install AUR packages with yay
  ansible.builtin.command:
    cmd: "yay -S --noconfirm --needed {{ item }}"
  loop: "{{ arch_aur_packages }}"
  become: false
  register: yay_result
  changed_when: "'installing' in yay_result.stdout or 'upgrading' in yay_result.stdout"
  when: arch_aur_packages | length > 0
