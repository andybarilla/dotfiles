# Install Rust via rustup
# https://rustup.rs

- name: Check if Rust is installed
  ansible.builtin.command: ~/.cargo/bin/rustc --version
  register: rust_check
  changed_when: false
  failed_when: false

- name: Install Rust
  ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  when: rust_check.rc != 0
  become: false
