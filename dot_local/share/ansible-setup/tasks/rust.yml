# Install Rust CLI
# https://claude.ai/download

- name: Check if Rust is installed
  ansible.builtin.command: which  rust
  register: rust_check
  changed_when: false
  failed_when: false

- name: Install Rust
  ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  when: rust_check.rc != 0
  become: false

- name: Add Rust activation to bashrc
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    line: 'eval "$(~/.local/bin/rust activate bash)"'
    state: present
  become: false
