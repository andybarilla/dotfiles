# Tasks for setting up external repositories on Ubuntu/Debian-based systems

# First, clean up any conflicting sources files that might break apt
- name: Remove conflicting VS Code sources file (before apt operations)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.sources
    state: absent
  become: true

- name: Install apt-transport-https and gpg
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gpg
      - curl
    state: present
    update_cache: true
  become: true

# 1Password repository
- name: Add 1Password GPG key
  ansible.builtin.shell:
    cmd: curl -sS https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
    creates: /usr/share/keyrings/1password-archive-keyring.gpg
  become: true

- name: Add 1Password apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main"
    filename: 1password
    state: present
  become: true

# VS Code repository
- name: Add Microsoft GPG key
  ansible.builtin.shell:
    cmd: curl -sS https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --output /usr/share/keyrings/microsoft-archive-keyring.gpg
    creates: /usr/share/keyrings/microsoft-archive-keyring.gpg
  become: true

- name: Add VS Code apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present
  become: true

# GitHub CLI repository
- name: Add GitHub CLI GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
    creates: /usr/share/keyrings/githubcli-archive-keyring.gpg
  become: true

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  become: true

# Google Chrome repository
- name: Add Google Chrome GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor --output /usr/share/keyrings/google-chrome-keyring.gpg
    creates: /usr/share/keyrings/google-chrome-keyring.gpg
  become: true

- name: Add Google Chrome apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
  become: true

# Docker repository
- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --output /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg
  become: true

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  become: true

# Tailscale repository
- name: Add Tailscale GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg --output /usr/share/keyrings/tailscale-archive-keyring.gpg
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg
  become: true

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present
  become: true

# WezTerm repository
- name: Add WezTerm GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL https://apt.fury.io/wez/gpg.key | gpg --dearmor -o /usr/share/keyrings/wezterm-fury.gpg
    creates: /usr/share/keyrings/wezterm-fury.gpg
  become: true

- name: Set permissions on WezTerm GPG key
  ansible.builtin.file:
    path: /usr/share/keyrings/wezterm-fury.gpg
    mode: '0644'
  become: true

- name: Add WezTerm apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
    filename: wezterm
    state: present
  become: true

# Update apt cache after adding repositories
- name: Update apt cache after adding repositories
  ansible.builtin.apt:
    update_cache: true
  become: true
