# Tasks for setting up external repositories on Ubuntu/Debian-based systems
# Uses the modern DEB822 .sources format (Ubuntu 24.04+ default).

- name: Install prerequisites for apt repository management
  ansible.builtin.apt:
    name:
      - gpg
      - curl
    state: present
    update_cache: true
  become: true

# Remove legacy .list files from previous runs (now superseded by .sources files)
- name: Remove legacy one-line apt source files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}.list"
    state: absent
  loop:
    - 1password
    - vscode
    - github-cli
    - google-chrome
    - tailscale
    - wezterm
    - lens
    - charm
  become: true

- name: Add 1Password apt repository
  ansible.builtin.deb822_repository:
    name: 1password
    types: deb
    uris: https://downloads.1password.com/linux/debian/amd64
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
    state: present
  become: true

- name: Add VS Code apt repository
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  become: true

- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present
  become: true

- name: Add Google Chrome apt repository
  ansible.builtin.deb822_repository:
    name: google-chrome
    types: deb
    uris: https://dl.google.com/linux/chrome/deb/
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://dl.google.com/linux/linux_signing_key.pub
    state: present
  become: true

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/ubuntu"
    suites: "{{ ubuntu_codename }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_codename }}.noarmor.gpg"
    state: present
  become: true

# WezTerm and Charm are flat repositories: trailing slash on URI, suite is "/", no components.
- name: Add WezTerm apt repository
  ansible.builtin.deb822_repository:
    name: wezterm
    types: deb
    uris: https://apt.fury.io/wez/
    suites: /
    signed_by: https://apt.fury.io/wez/gpg.key
    state: present
  become: true

- name: Add Lens apt repository
  ansible.builtin.deb822_repository:
    name: lens
    types: deb
    uris: https://downloads.k8slens.dev/apt/debian
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://downloads.k8slens.dev/keys/gpg
    state: present
  become: true

- name: Add Charm apt repository
  ansible.builtin.deb822_repository:
    name: charm
    types: deb
    uris: https://repo.charm.sh/apt/
    suites: /
    signed_by: https://repo.charm.sh/apt/gpg.key
    state: present
  become: true

- name: Update apt cache after adding repositories
  ansible.builtin.apt:
    update_cache: true
  become: true
