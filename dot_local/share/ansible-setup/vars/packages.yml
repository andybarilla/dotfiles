# Package lists for workstation setup
# Edit this file to add/remove packages

# ============================================
# Fedora packages
# ============================================

# Packages available in Fedora repositories
fedora_packages:
  - alacritty
  - zsh
  - btop
  - gh
  - NetworkManager-openvpn
  - ripgrep
  - python3-psutil
  - tailscale
 
# Packages from external repositories (repos must be configured first)
external_packages:
  - 1password
  - 1password-cli
  - code
  - google-chrome-stable
  - lens
  - synology-drive

# RPMs to download and install directly
remote_rpms: []

# ============================================
# Ubuntu/Debian packages
# ============================================

# Packages available in Ubuntu repositories
ubuntu_packages:
  - btop
  - network-manager-openvpn
  - ripgrep
  - golang-go
  - build-essential
  - zsh
  - libnotify-bin
  - neovim

# Packages from external repositories (repos must be configured first)
ubuntu_external_packages:
  - 1password
  - code
  - gh
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - google-chrome-stable
  - tailscale

# DEBs to download and install directly
remote_debs: []

# ============================================
# Arch Linux packages
# ============================================

# Packages available in Arch repositories
arch_packages:
  # Desktop environment and display
  - niri
  - fuzzel
  - xdg-desktop-portal-gtk
  - swaybg
  - swayidle
  - swaylock
  - xwayland-satellite
  - udiskie
  - gvfs
  - gvfs-smb
  - gnome-keyring
  - avahi
  - qt6ct
  - qt6-wayland
  - qt5-wayland
  - xorg-xwayland
  # Networking
  - tailscale
  - networkmanager-openvpn
  # Audio stack
  - pipewire
  - wireplumber
  - pipewire-pulse
  - pipewire-alsa
  - wiremix
  - python-evdev
  # Development
  - base-devel
  - git
  - go
  - less
  - vi
  - jdk21-openjdk
  - maven
  - npm
  - nodejs
  - valkey
  - mise
  - 7zip
  - ttf-jetbrains-mono-nerd
  - ttf-noto-nerd
  - neovim
  # System utilities
  - openssh
  - btop
  - ripgrep
  - rsync
  - firefox
  - wget
  # Container tools
  - docker
  - docker-compose 
  # Authentication
  - yubikey-manager
  - pam-u2f
  - libfido2
  - gnupg
  - pcsclite
  - ccid
  - usbutils
  # Shell
  - zsh
  - zellij
  - cups-pk-helper
  - kimageformats
  - cava

# Packages from AUR (requires yay or similar)
arch_aur_packages:
  - wtype
  - 1password-beta
  - github-cli
  - synology-drive
  - postman-bin
  - slack-desktop-wayland
  - obsidian
  - remmina
  - claude-desktop-bin
  - yubico-authenticator
  - linux-firmware-hauppauge
  - google-chrome 
  - lens-bin
  - dms-shell-bin

# Systemd services to enable
arch_services:
  - pcscd
  - sshd
  - tailscaled

# Systemd user timers to enable
arch_user_timers:
  - daily-dev-summary.timer

# Systemd user services to enable
arch_user_services:
  - whisper-dictate.service
