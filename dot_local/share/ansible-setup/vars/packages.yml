# Package lists for workstation setup
# Edit this file to add/remove packages

# ============================================
# Fedora packages
# ============================================

# Packages available in Fedora repositories
fedora_packages:
  - alacritty
  - zsh
  - btop
  - gh
  - NetworkManager-openvpn
  - ripgrep
  - python3-psutil
 
# Packages from external repositories (repos must be configured first)
external_packages:
  - 1password
  - 1password-cli
  - code
  - google-chrome-stable
  - lens
  - synology-drive

# RPMs to download and install directly
remote_rpms: []

# ============================================
# Ubuntu/Debian packages
# ============================================

# Packages available in Ubuntu repositories
