# Package lists for workstation setup
# Edit this file to add/remove packages

# ============================================
# Fedora packages
# ============================================

# Packages available in Fedora repositories
fedora_packages:
  - btop
  - distrobox
  - gh
  - NetworkManager-openvpn
  - podman-compose
  - podman-docker
  - ripgrep
  - go

# Packages from external repositories (repos must be configured first)
external_packages:
  - 1password
  - chromium
  - code
  - lens
  - nautilus-dropbox

# RPMs to download and install directly
remote_rpms: []

# ============================================
# Ubuntu/Debian packages
# ============================================

# Packages available in Ubuntu repositories
ubuntu_packages:
  - btop
  - distrobox
  - flatpak
  - gnome-software-plugin-flatpak
  - network-manager-openvpn
  - podman
  - podman-compose
  - podman-docker
  - python3-distutils-extra
  - ripgrep
  - golang-go
  - chromium-browser
  - build-essential

# Packages from external repositories (repos must be configured first)
ubuntu_external_packages:
  - 1password
  - code
  - gh

# DEBs to download and install directly
remote_debs: []

# ============================================
# Arch Linux packages
# ============================================

# Packages available in Arch repositories
arch_packages:
  # Desktop environment and display
  - cosmic
  - gvfs
  - gvfs-smb
  - gnome-keyring
  # Audio stack
  - pipewire
  - wireplumber
  - pipewire-pulse
  - pipewire-alsa
  # Development
  - base-devel
  - git
  - go
  - less
  # System utilities
  - openssh
  - btop
  - ripgrep
  - firefox
  # Container tools
  - distrobox
  - podman
  - podman-compose
  - podman-docker

# Packages from AUR (requires yay or similar)
arch_aur_packages:
  - 1password
  - visual-studio-code-bin
  - github-cli

# Systemd services to enable
arch_services:
  - cosmic-greeter
