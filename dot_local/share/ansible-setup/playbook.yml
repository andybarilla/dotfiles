---
# Workstation setup playbook
# Works with Fedora (traditional and atomic), Ubuntu/Debian-based, and Arch Linux systems
#
# Usage:
#   ansible-playbook playbook.yml -K
#
# Or use the bootstrap script:
#   ./bootstrap.sh

- name: Setup workstation
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/packages.yml
    - vars/repo_keys.yml
    - vars/flatpaks.yml
    - vars/gcloud.yml

  pre_tasks:
    - name: Set distribution facts
      ansible.builtin.set_fact:
        is_ubuntu: "{{ ansible_distribution in ['Ubuntu', 'Pop!_OS', 'Linux Mint', 'elementary OS', 'Debian'] }}"
        is_fedora: "{{ ansible_distribution == 'Fedora' }}"
    
    - name: Display detected system type
      ansible.builtin.debug:
        msg: >-
          Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}

  tasks:
    - name: Configure dnf performance settings
      ansible.builtin.include_tasks: tasks/dnf-config.yml
      when: is_fedora

    - name: Setup external repositories (Fedora)
      ansible.builtin.include_tasks: tasks/repos.yml
      when: is_fedora

    - name: Setup external repositories (Ubuntu)
      ansible.builtin.include_tasks: tasks/repos-apt.yml
      when: is_ubuntu

    - name: Install packages (Fedora)
      ansible.builtin.include_tasks: tasks/packages-dnf.yml
      when: is_fedora

    - name: Install packages (Ubuntu)
      ansible.builtin.include_tasks: tasks/packages-apt.yml
      when: is_ubuntu

    - name: Install Claude Code
      ansible.builtin.include_tasks: tasks/claude-code.yml

    - name: Install Opencode
      ansible.builtin.include_tasks: tasks/opencode.yml

    - name: Install Mise-en-Place
      ansible.builtin.include_tasks: tasks/mise.yml

    - name: Install Google Cloud SDK
      ansible.builtin.include_tasks: tasks/gcloud.yml

    - name: Install Pure prompt for zsh
      ansible.builtin.include_tasks: tasks/pure-prompt.yml

    - name: Configure git
      ansible.builtin.include_tasks: tasks/git.yml

    - name: Configure desktop settings
      ansible.builtin.include_tasks: tasks/desktop-settings.yml
