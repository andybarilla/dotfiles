#
# Example .tmux.conf
#
# By Nicholas Marriott. Public domain.
#

# Some tweaks to the status line
set -g status-style "bg=colour235,fg=colour248"
set -g status-right "%H:%M"
set -g window-status-current-style "bold,fg=colour15"

# If running inside tmux ($TMUX is set), then change the status line to red
%if #{TMUX}
set -g status-bg red
%endif

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-features ",xterm*:RGB"

# Change the default $TERM to tmux-256color
set -g default-terminal "tmux-256color"

# No bells at all
set -g bell-action none

# Keep windows around after they exit
set-option -g remain-on-exit off

# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -g pane-base-index 1

# Turn the mouse on, but without copy mode dragging
set -g mouse on
unbind -n MouseDrag1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode-vi MouseDrag1Pane

# Set bind key to reload configuration file
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# splitting panes with | and -
bind | split-window -h
bind - split-window -v

# Alt+Ctrl+Arrow to move between panes
bind -n M-C-Left select-pane -L
bind -n M-C-Right select-pane -R
bind -n M-C-Up select-pane -U
bind -n M-C-Down select-pane -D

# Alt+Ctrl+Shift+Arrow to move between windows
bind -n M-C-S-Left previous-window
bind -n M-C-S-Right next-window

# Some extra key bindings to select higher numbered windows
bind F1 selectw -t:10
bind F2 selectw -t:11
bind F3 selectw -t:12
bind F4 selectw -t:13
bind F5 selectw -t:14
bind F6 selectw -t:15
bind F7 selectw -t:16
bind F8 selectw -t:17
bind F9 selectw -t:18
bind F10 selectw -t:19
bind F11 selectw -t:20
bind F12 selectw -t:21

bind X confirm-before -p "Kill Session #S? (y/n)" kill-session

# A key to toggle between smallest and largest sizes if a window is visible in
# multiple places
bind F set -w window-size

# Keys to toggle monitoring activity in a window and the synchronize-panes option
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Slightly dim inactive panes; active pane stays default
set -g window-style "fg=colour245,bg=default"
set -g window-active-style "fg=colour255,bg=default"

# Subtle border distinction
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour117"

# Vi-style copy mode with system clipboard (Wayland)
set -g mode-keys vi
bind-key -T copy-mode-vi 'y' send -X copy-pipe "wl-copy"
bind-key p run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"
