# Starship prompt — Pure preset, lightly customized.
# https://starship.rs/presets/pure-preset

format = """
$username\
$hostname\
$directory\
${custom.gcp_scoped}\
${custom.gcp_agent}\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
show_always = true
style_user = "bright-black"
style_root = "red bold"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bright-black"
format = "[@$hostname]($style) "

[directory]
style = "blue"

[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

# GCP active-identity indicator (operator-agent-onramp). The onramp sets $PROMPT
# directly, which starship overwrites — so we rebuild its [gcp:role@tier] tag here
# from the exported env instead. Two modules keep the onramp's color coding:
# cyan for scoped dev/infra, yellow for the agent identity. Shown only inside a
# titlevision-ai working tree.
[custom.gcp_scoped]
command = 'r="${GCP_IDENTITY%%:*}"; t=""; case "$CLOUDSDK_CORE_PROJECT" in *staging*) t="@staging";; esac; printf "[gcp:%s%s]" "$r" "$t"'
when = '[ -n "$GCP_IDENTITY" ] && [ "${GCP_IDENTITY%%:*}" != agent ] && echo "$PWD" | grep -q titlevision-ai'
format = "[$output](cyan) "

[custom.gcp_agent]
command = 't=""; case "$CLOUDSDK_CORE_PROJECT" in *staging*) t="@staging";; esac; printf "[gcp:agent%s]" "$t"'
when = '[ "${GCP_IDENTITY%%:*}" = agent ] && echo "$PWD" | grep -q titlevision-ai'
format = "[$output](yellow) "
